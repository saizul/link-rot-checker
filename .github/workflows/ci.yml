name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Test
        run: pytest
      - name: CLI smoke test (local demo site)
        run: |
          link-rot-checker --version
          python -m http.server 8765 --bind 127.0.0.1 --directory examples/demo-site >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8765/ >/dev/null && break; sleep 0.5; done
          # The demo site has broken links on purpose, so the scan must exit with 1.
          set +e
          link-rot-checker scan http://127.0.0.1:8765/ --no-wayback --timeout 5 --retries 0 -f all -o smoke
          code=$?
          set -e
          test "$code" -eq 1
          python - <<'PY'
          import json
          d = json.load(open("smoke/link-rot.json"))
          top = d["fix_list"][0]
          assert top["target"] == "http://127.0.0.1:8765/pricing.html", top
          assert top["impact"] == 3, top
          assert d["summary"]["broken"] == 4, d["summary"]
          assert "http://127.0.0.1:8765/private/drafts.html" in d["skipped_pages"] or any(
              t["url"].endswith("/private/drafts.html") and t["category"] == "skipped" for t in d["targets"]
          )
          PY
          test -s smoke/link-rot.html
          test -s smoke/link-rot-fix-list.csv
          link-rot-checker scan http://127.0.0.1:8765/ --no-wayback --fail-on none --quiet
          python examples/library_usage.py http://127.0.0.1:8765/

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t link-rot-checker:ci .
      - run: docker run --rm link-rot-checker:ci --version
      - name: Scan the demo site from the container
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory examples/demo-site >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8765/ >/dev/null && break; sleep 0.5; done
          docker run --rm --network host -v "$RUNNER_TEMP:/out" --user "$(id -u)" link-rot-checker:ci \
            scan http://127.0.0.1:8765/ --no-wayback --fail-on none -f html -o /out
          test -s "$RUNNER_TEMP/link-rot.html"
