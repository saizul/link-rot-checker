# Weekly link check for your website. Copy to .github/workflows/link-rot.yml in your site's repository.
name: Link rot

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "link-rot-checker @ git+https://github.com/saizul/link-rot-checker"
      - uses: actions/cache@v4
        with:
          path: .link-rot-cache
          key: link-rot-${{ github.run_id }}
          restore-keys: link-rot-
      - name: Scan
        run: >
          link-rot-checker scan https://www.example.com/
          --sitemap https://www.example.com/sitemap.xml
          --wayback-cache .link-rot-cache/wayback.json
          -f all -o link-rot-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-rot-report
          path: link-rot-report/
